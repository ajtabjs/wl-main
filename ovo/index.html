<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OvO</title>
<link rel="icon" href="assets/img/home-icon.png">
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#fff;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:24px;font:15px system-ui,sans-serif}
.picker{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.picker h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:2px}
select,button{font:15px system-ui,sans-serif;padding:11px 14px;border-radius:6px;border:1px solid #333;background:#000;color:#fff;color-scheme:dark;outline:none}
select{cursor:pointer}
button{cursor:pointer;background:#fff;border-color:#fff;color:#000;font-weight:600}
button:hover:not(:disabled){background:#d9d9d9;border-color:#d9d9d9}
button:disabled{background:#111;border-color:#222;color:#555;cursor:not-allowed}
select:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<form class="picker" id="picker">
<h1>pick your version</h1>
<select id="v" aria-label="Version" required>
<option value="" disabled selected>pick a version</option>
<optgroup label="releases">
<option value="1.4.5">1.4.5 (latest)</option>
<option value="1.4.4">1.4.4</option>
<option value="1.4.3">1.4.3</option>
<option value="1.4.2">1.4.2</option>
<option value="1.4.1">1.4.1</option>
<option value="1.4">1.4</option>
</optgroup>
<optgroup label="other">
<option value="crashtest1.4.4b">1.4.4b (crash test)</option>
<option value="reverse">Reverse</option>
<option value="kaizo">Kaizo</option>
<option value="crashtestleveleditor">Crash Test Level Editor</option>
</optgroup>
<optgroup label="dimensions">
<option value="dimensions_v101">Dimensions 1.0.1</option>
<option value="dimensions_qa_v7">Dimensions Beta 7</option>
<option value="dimensions_qa_v4">Dimensions Beta 4</option>
<option value="dimensions_qa_v3">Dimensions Beta 3</option>
</optgroup>
</select>
<button id="play" type="submit" disabled>play</button>
</form>
<script>
var select = document.getElementById("v");
var play = document.getElementById("play");
var key = "ovo-last-version";
var saved = localStorage.getItem(key);

if (saved && Array.prototype.some.call(select.options, function (option) {
  return option.value === saved;
})) {
  select.value = saved;
  play.disabled = false;
}

select.addEventListener("change", function () {
  play.disabled = !select.value;
});

document.getElementById("picker").addEventListener("submit", function (event) {
  event.preventDefault();
  if (!select.value) return;
  localStorage.setItem(key, select.value);
  location.assign("./" + select.value + "/");
});
</script>
</body>
</html>
