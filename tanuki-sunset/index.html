<!DOCTYPE html>
<html>
  <head>
    <title>Tanuki Sunset | 3kh0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="img/cover.png" />
    <link rel="shortcut icon" type="image/x-icon" href="img/cover.png" />
    <script src="js/UnityLoader.js"></script>
    <script>
      var gameInstance;

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try {
          cache = await caches.open("tanukisunset");
        } catch (err) {
          cache = null;
        }
        if (cache) {
          const cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            const blob = await cachedResponse.blob();
            return URL.createObjectURL(blob);
          }
        }
        const buffers = await Promise.all(
          fileParts.map(part => fetch(part).then(r => {
            if (!r.ok) throw new Error("Failed to fetch " + part);
            return r.arrayBuffer();
          }))
        );
        const mergedBlob = new Blob(buffers);
        if (cache) {
          try {
            await cache.put(cacheKey, new Response(mergedBlob));
          } catch (err) {
            console.warn("Cache write failed for " + cacheKey, err);
          }
        }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      async function loadGame() {
        const jsonUrl = new URL("tanuki.json", document.baseURI).href;
        const config = await fetch(jsonUrl).then(r => r.json());
        const dataPath = "unity/tanuki.data.unityweb";
        config.dataUrl = await mergeFiles(getParts(dataPath, 0, 2), "tanukisunset/" + dataPath);
        ["wasmCodeUrl", "wasmFrameworkUrl", "backgroundUrl"].forEach(key => {
          if (config[key]) config[key] = new URL(config[key], jsonUrl).href;
        });
        const configUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: "application/json" }));
        gameInstance = UnityLoader.instantiate("gameContainer", configUrl);
      }

      loadGame().catch(err => console.error("Failed to load Tanuki Sunset:", err));
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
    <script type="text/javascript" src="../js/main.js"></script>
  </body>
</html>
