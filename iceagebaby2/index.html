<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>3kh0 | Ice Age Baby Adventure</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Ice Age Baby Adventure</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function mergeFiles(fileParts) {
        return new Promise((resolve, reject) => {
          let buffers = [];

          function fetchPart(index) {
            if (index >= fileParts.length) {
              const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
              console.log(`Combined size for ${fileParts[0].split(".part")[0]}:`, totalLength);

              const combined = new Uint8Array(totalLength);
              let offset = 0;
              for (const buf of buffers) {
                combined.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
              }

              const mergedBlob = new Blob([combined], { type: "application/octet-stream" });
              resolve(mergedBlob);
              return;
            }

            fetch(fileParts[index])
              .then(resp => {
                if (!resp.ok) throw new Error(`Failed to fetch ${fileParts[index]}`);
                return resp.arrayBuffer();
              })
              .then(data => {
                buffers.push(data);
                fetchPart(index + 1);
              })
              .catch(reject);
          }

          fetchPart(0);
        });
      }

      function getParts(file, totalParts) {
        let parts = [];
        for (let i = 0; i < totalParts; i++) {
          parts.push(`${file}.part${i}`);
        }
        return parts;
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/iceagebaby2.loader.js";
      var dataFile = buildUrl + "/webgl.data";
      var dataParts = 6; // part0 through part5

      mergeFiles(getParts(dataFile, dataParts))
        .then(dataBlob => {
          const dataBlobUrl = URL.createObjectURL(dataBlob);
          console.log("Data blob ready:", dataBlobUrl);

          const originalFetch = window.fetch;
          window.fetch = async function(url, ...args) {
            if (typeof url === "string" && url.includes("webgl.data")) {
              return originalFetch(dataBlobUrl, ...args);
            }
            return originalFetch(url, ...args);
          };

          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (typeof url === "string" && url.includes("webgl.data")) {
              url = dataBlobUrl;
            }
            return originalOpen.call(this, method, url, ...rest);
          };

          var config = {
            dataUrl: buildUrl + "/webgl.data",
            frameworkUrl: buildUrl + "/build.framework.js",
            codeUrl: buildUrl + "/build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Ice Age Baby Adventure",
            productVersion: "0.1",
            showBanner: unityShowBanner,
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
            unityShowBanner('WebGL builds are not supported on mobile devices.');
          } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
          }

          loadingBar.style.display = "block";

          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              loadingBar.style.display = "none";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);
        })
        .catch(err => {
          console.error("Failed to merge data parts:", err);
          alert("Failed to load game data: " + err.message);
        });
    </script>
  </body>
</html>
