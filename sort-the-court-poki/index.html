	<script>
		(() => {
			const originalfetch = window.fetch.bind(window);
			const wasmname = window.config.metadata.code_filename;
			const cachename = 'sort-the-court-wasm';
			const maxparts = 1000;

			const loadparts = async (wasmurl) => {
				const buffers = [];
				for (let index = 0; index < maxparts; index++) {
					const parturl = wasmurl + '.part' + index;
					const response = await originalfetch(parturl);
					const contenttype = response.headers.get('Content-Type') || '';
					if (!response.ok || contenttype.indexOf('text/html') !== -1) {
						break;
					}
					buffers.push(await response.arrayBuffer());
				}
				if (buffers.length === 0) {
					throw new Error('No split parts found for ' + wasmurl);
				}
				const blob = new Blob(buffers, { type: 'application/wasm' });
				return new Response(blob, {
					status: 200,
					headers: {
						'Content-Type': 'application/wasm',
						'Content-Length': String(blob.size)
					}
				});
			};

			const mergefiles = async (wasmurl, cachekey) => {
				let cache = null;
				try {
					cache = window.caches ? await caches.open(cachename) : null;
					const cached = cache ? await cache.match(cachekey) : null;
					if (cached) {
						return cached;
					}
				} catch (error) {
					cache = null;
				}

				const response = await loadparts(wasmurl);
				if (cache) {
					try {
						await cache.put(cachekey, response.clone());
					} catch (error) {}
				}
				return response;
			};

			const streamingassetsurl = new URL('StreamingAssets/', document.baseURI);
			const pageorigin = window.location.origin;
			const rootprefix = pageorigin + '/StreamingAssets/';

			const fixstreamingassets = (url) => {
				const absolute = new URL(url, document.URL);
				if (absolute.origin !== pageorigin) {
					return url;
				}
				const href = absolute.href;
				if (href.indexOf(rootprefix) !== 0) {
					return url;
				}
				const suffix = href.slice(rootprefix.length);
				const search = absolute.search + absolute.hash;
				return streamingassetsurl.href + suffix.slice(0, suffix.length - search.length) + search;
			};

			window.fetch = async (input, init) => {
				const requesturl = typeof input === 'string' ? input : (input.url || String(input));
				const cleanurl = requesturl.split(/[?#]/)[0];

				if (!cleanurl.endsWith(wasmname)) {
					const fixedurl = fixstreamingassets(requesturl);
					if (fixedurl !== requesturl) {
						return originalfetch(fixedurl, init);
					}
					return originalfetch(input, init);
				}

				const method = ((init && init.method) || input.method || 'GET').toUpperCase();
				const wasmurl = new URL(cleanurl, document.baseURI).href;
				const response = await mergefiles(wasmurl, wasmurl);

				if (method === 'HEAD') {
					return new Response(null, { status: response.status, headers: response.headers });
				}
				return response;
			};
		})();
