<script>
/* webripper:gamemonetize-stub */

(function () {
  window._runGame = true;
  window.SDK_OPTIONS = window.SDK_OPTIONS || { onEvent: function () {} };

  // Some games show a full-screen "PLEASE WAIT" overlay while an ad plays and
  // only unblock when the SDK reports the ad is over (SDK_GAME_START).  With no
  // real ad to wait for, emulate that lifecycle immediately and release the
  // game, otherwise it would freeze on the overlay forever.
  var emit = function (name) {
    try {
      var options = window.SDK_OPTIONS;
      if (options && typeof options.onEvent === 'function') {
        options.onEvent({ name: name });
        return;
      }
    } catch (e) {}
    // Fall back to the pause/resume hooks the driver installs directly.
    try {
      if (name === 'SDK_GAME_PAUSE' && typeof window._adPauseGame === 'function') {
        window._adPauseGame();
      } else if (name === 'SDK_GAME_START' && typeof window._adResumeGame === 'function') {
        window._adResumeGame();
      }
    } catch (e) {}
  };
  var runAd = function (cb) {
    emit('SDK_GAME_PAUSE');
    emit('SDK_GAME_START');
    if (cb) { try { cb(); } catch (e) {} }
  };
  var noop = function () {};
  var base = {
    showBanner: function () { runAd(); },
    showAd: function (cb) { runAd(cb); },
    showRewarded: function (cb) { runAd(cb); },
    showRewardedAd: function (cb) { runAd(cb); },
    onEvent: noop,
    gameLoadingStart: noop,
    gameLoadingFinished: noop,
    gameplayStart: noop,
    gameplayStop: noop,
    happyTime: noop,
    commercialBreak: function (cb) {
      runAd(cb);
      return Promise.resolve();
    },
    rewardedBreak: function (cb) {
      runAd(cb);
      return Promise.resolve(true);
    }
  };
  window.sdk = new Proxy(base, {
    get: function (target, prop) {
      if (prop === 'then') return undefined;
      if (prop in target) return target[prop];
      return function () {};
    }
  });
})();

</script>
