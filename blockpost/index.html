

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Blockpost - Unblocked Games Compilation</title>
	<script>
	window.config = {
		loader: 'unity',
		debug: false,
		maxRatio: 16 / 9,
		minRatio: 9 / 16,

		title: 'Blockpost',
		thumbnail: 'thumb.png',
		numScreenshots: 4,

		unityVersion: '2018.4.32f1',
		unityWebglBuildUrl: 'Build\/webgl_poki.json',

		fileSize: 22,
		cachedDecompressedFileSizes: {
			'webgl_poki.data.unityweb':  12379304 ,
			'webgl_poki.wasm.code.unityweb':  9776558 ,
			'webgl_poki.wasm.framework.unityweb':  100499 ,
		},
	};
	</script>
	<script>
	function mergeFiles(fileParts, cacheKey) {
		return caches.open("blockpost-split-cache").then(function (cache) {
			return cache.match(cacheKey).then(function (cachedResponse) {
				if (cachedResponse) {
					return cachedResponse.blob().then(function (blob) {
						return URL.createObjectURL(blob);
					});
				}
				return Promise.all(
					fileParts.map(function (part) {
						return fetch(part).then(function (r) {
							return r.arrayBuffer();
						});
					})
				).then(function (buffers) {
					var mergedBlob = new Blob(buffers);
					return cache
						.put(cacheKey, new Response(mergedBlob))
						.then(function () {
							return URL.createObjectURL(mergedBlob);
						});
				});
			});
		});
	}

	function getParts(file, start, end) {
		var parts = [];
		for (var i = start; i <= end; i++) {
			parts.push(file + ".part" + i);
		}
		return parts;
	}

	window.__blockpostSplitWasm = mergeFiles(
		getParts("Build/webgl_poki.wasm.code.unityweb", 0, 1),
		"blockpost-split-cache"
	);
	</script>
    </head>
<body>
	<script src="master-loader.js"></script>
    </body>
</html>
