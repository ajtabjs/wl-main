name: auto purge jsdelivr cache for files

on:
  push:
    branches:
      - master

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/
          sparse-checkout-cone-mode: true

      - name: Fetch before commit
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git fetch --depth=1 --filter=blob:none origin ${{ github.event.before }}

      - name: Get changed files and build jsDelivr URLs
        id: purge_urls
        run: |
          FILES=$(git diff --no-renames --name-only \
            ${{ github.event.before }} \
            ${{ github.event.after }} \
            --diff-filter=AMR)

          FILTERED=$(printf '%s\n' "$FILES" | grep -Ev '^(\.github/|.*\.md$|.*\.txt$)' || true)

          REPO="${{ github.repository }}"

          # Percent-encode each path. The action splits its input on /[\s,]+/,
          # so a raw space in a path (e.g. "DOOMORI/Build/WEBGL Doomori Build...")
          # would be torn into bogus tokens and fail validation.
          URLS=$(printf '%s\n' "$FILTERED" | python3 -c '
          import sys, urllib.parse
          repo = sys.argv[1]
          paths = [p for p in (l.strip("\n") for l in sys.stdin) if p]
          out = []
          for alias in ("main", "master", "latest"):
              for p in paths:
                  out.append("https://cdn.jsdelivr.net/gh/%s@%s/%s" % (
                      repo, alias, urllib.parse.quote(p, safe="/")))
          print(",".join(out))
          ' "$REPO")

          echo "urls=$URLS" >> $GITHUB_OUTPUT

      - name: Purge jsDelivr cache
        if: steps.purge_urls.outputs.urls != ''
        uses: egad13/purge-jsdelivr-cache@v1
        with:
          url: ${{ steps.purge_urls.outputs.urls }}
          attempts: 5
