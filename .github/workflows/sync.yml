name: 'sync forks w main'

on:
  schedule:
    - cron: '*/7 * * * *'

  workflow_dispatch:
    inputs:
      sync_test_mode:
        description: 'Fork Sync Test Mode (skip the actual sync)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo
    if: github.repository != 'ajtabjs/wl-main'

    steps:
    - name: Sync fork with upstream
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TEST_MODE: ${{ inputs.sync_test_mode }}
      run: |
        if [ "$TEST_MODE" = "true" ]; then
          echo "Test mode: skipping sync."
          exit 0
        fi
        gh repo sync "${{ github.repository }}" --source ajtabjs/wl-main --branch master
