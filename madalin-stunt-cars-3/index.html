<!DOCTYPE html>
<html>
  <head>
    <title>Madalin Stunt Cars 3 | 3kh0</title>
  </head>
  <link rel="icon" type="image/x-icon" href="img/index.jpg" />
  <link rel="stylesheet" href="TemplateData/style.css" />
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="js/unityloader35.js"></script>
  <script src="../js/main.js"></script>
  <body>
    <script>
      var gameInstance;

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try {
          cache = await caches.open("madalinstuntcars3");
        } catch (err) {
          cache = null;
        }
        if (cache) {
          const cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            const blob = await cachedResponse.blob();
            return URL.createObjectURL(blob);
          }
        }
        const buffers = await Promise.all(
          fileParts.map(part => fetch(part).then(r => {
            if (!r.ok) throw new Error("Failed to fetch " + part);
            return r.arrayBuffer();
          }))
        );
        const mergedBlob = new Blob(buffers);
        if (cache) {
          try {
            await cache.put(cacheKey, new Response(mergedBlob));
          } catch (err) {
            console.warn("Cache write failed for " + cacheKey, err);
          }
        }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      async function loadGame() {
        const jsonUrl = new URL("game.json", document.baseURI).href;
        const config = await fetch(jsonUrl).then(r => r.json());
        const dataPath = "unity/data.unityweb";
        config.dataUrl = await mergeFiles(getParts(dataPath, 0, 2), "madalinstuntcars3/" + dataPath);
        ["asmCodeUrl", "asmMemoryUrl", "asmFrameworkUrl", "wasmCodeUrl", "wasmFrameworkUrl", "backgroundUrl"].forEach(key => {
          if (config[key]) config[key] = new URL(config[key], jsonUrl).href;
        });
        const configUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: "application/json" }));
        gameInstance = UnityLoader.instantiate("gameContainer", configUrl, {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              UnityProgress(gameInstance, "complete");
            },
          },
        });
      }

      loadGame().catch(err => console.error("Failed to load Madalin Stunt Cars 3:", err));
    </script>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 100%; margin: auto;"></div>
    </div>
  </body>
</html>
