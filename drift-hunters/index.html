<html>
  <head>
    <title>Drift Hunters | 3kh0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Drift Hunters" />
    <link rel="icon" type="image/png" href="drift-hunters.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="./UnityLoader.js"></script>
    <script>
      // The data archive is 157,908,802 bytes, which is over jsdelivr's 20 MB
      // per-file limit - the CDN answers 403 with a text/plain body instead of
      // the file. It is stored as eight parts and stitched back together here,
      // the same way station-141 does it, then cached so only the first load
      // pays for it.
      //
      // UnityLoader does not look at the download before reading the archive
      // header out of it, so a failed or truncated fetch surfaces as
      //
      //   Uncaught RangeError: Offset is outside the bounds of the DataView
      //     at UnityLoader.js:3695
      //
      // with nothing but a black screen for the visitor. The merged bytes are
      // therefore checked for the UnityWebData1.0 magic before the loader ever
      // sees them, and anything else gets a readable message instead.
      var CONFIG_URL = "./dh.json";
      var DATA_PATH = "dh.data.unityweb";
      var DATA_PARTS = 8;
      var ARCHIVE_MAGIC = "UnityWebData1.0";

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
        });
      }

      function showError(heading, detail) {
        document.getElementById("gameContainer").innerHTML =
          '<div style="box-sizing:border-box;width:100%;height:100%;padding:32px;' +
          "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
          "gap:12px;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI," +
          'Roboto,Helvetica,Arial,sans-serif;text-align:center">' +
          '<h2 style="margin:0;font-size:20px">' + escapeHtml(heading) + "</h2>" +
          '<p style="margin:0;max-width:46ch;color:#aaa;font-size:14px;line-height:1.5">' +
          detail + "</p></div>";
      }

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try {
          cache = await caches.open("drifthunters");
        } catch (err) {
          cache = null;
        }
        if (cache) {
          const cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            return URL.createObjectURL(await cachedResponse.blob());
          }
        }
        const buffers = await Promise.all(
          fileParts.map(function (part) {
            return fetch(part).then(function (r) {
              if (!r.ok) throw new Error("Failed to fetch " + part + " (HTTP " + r.status + ")");
              return r.arrayBuffer();
            });
          })
        );
        const mergedBlob = new Blob(buffers);
        if (cache) {
          try {
            await cache.put(cacheKey, new Response(mergedBlob));
          } catch (err) {
            console.warn("Cache write failed for " + cacheKey, err);
          }
        }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        var parts = [];
        for (var i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      async function checkArchive(url) {
        var res = await fetch(url, { headers: { Range: "bytes=0-15" } });
        if (!res.ok && res.status !== 206) {
          throw new Error("HTTP " + res.status);
        }
        var bytes = new Uint8Array(await res.arrayBuffer());
        var magic = String.fromCharCode.apply(null, bytes.subarray(0, ARCHIVE_MAGIC.length));
        if (magic !== ARCHIVE_MAGIC) {
          throw new Error("got " + JSON.stringify(magic) + " instead of a Unity data archive");
        }
      }

      async function startGame() {
        var configUrl = new URL(CONFIG_URL, document.baseURI).href;
        var config = await fetch(configUrl).then(function (r) {
          if (!r.ok) throw new Error("could not read " + CONFIG_URL);
          return r.json();
        });

        var dataUrl;
        try {
          dataUrl = await mergeFiles(
            getParts(DATA_PATH, 0, DATA_PARTS - 1),
            "drifthunters/" + DATA_PATH
          );
          await checkArchive(dataUrl);
        } catch (err) {
          showError(
            "Drift Hunters can't load its game data",
            "The Unity data archive is stored as " + DATA_PARTS + " parts next to this page and " +
              "one of them did not arrive: " + escapeHtml(err.message) + "."
          );
          return;
        }

        config.dataUrl = dataUrl;
        ["asmCodeUrl", "asmMemoryUrl", "asmFrameworkUrl", "backgroundUrl"].forEach(function (key) {
          if (config[key]) config[key] = new URL(config[key], configUrl).href;
        });

        var patchedUrl = URL.createObjectURL(
          new Blob([JSON.stringify(config)], { type: "application/json" })
        );
        window.gameInstance = UnityLoader.instantiate("gameContainer", patchedUrl);
      }

      startGame().catch(function (err) {
        console.error("Failed to start Drift Hunters:", err);
        showError("Drift Hunters failed to start", escapeHtml(err && err.message ? err.message : err));
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100vw; height: 100vh; margin: 0;"></div>
    </div>
    <!--<script src="/js/main.js"></script>-->
  </body>
</html>
