<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Duck Life Treasure Hunt</title>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <canvas id="unity-canvas" style="margin: 0; width: 100%; height: 100%; background: #231F20"></canvas>
    <script src="unity/WebGL.loader.js"></script>
    <script>
      async function mergeFiles(fileParts, cacheKey) {
        const cache = await caches.open("treasurehunt-split");
        const cachedResponse = await cache.match(cacheKey);
        if (cachedResponse) {
          const blob = await cachedResponse.blob();
          return URL.createObjectURL(blob);
        }
        const buffers = await Promise.all(
          fileParts.map(part => fetch(part).then(r => r.arrayBuffer()))
        );
        const mergedBlob = new Blob(buffers);
        await cache.put(cacheKey, new Response(mergedBlob));
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        const [dataUrl, wasmCodeUrl] = await Promise.all([
          mergeFiles(getParts("unity/DLTH%20WebGL.data.unityweb", 0, 3), "unity/DLTH WebGL.data"),
          mergeFiles(getParts("unity/DLTH%20WebGL.wasm.code.unityweb", 0, 1), "unity/DLTH WebGL.wasm"),
        ]);

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          this._requestUrl = url;
          if (url.includes("DLTH WebGL.data")) {
            url = dataUrl;
          } else if (url.includes("DLTH WebGL.wasm")) {
            url = wasmCodeUrl;
          }
          this._modifiedUrl = url;
          return originalOpen.call(this, method, url, ...rest);
        };

        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: "unity/DLTH WebGL.data",
          frameworkUrl: "unity/framework.js",
          codeUrl: "unity/DLTH WebGL.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Mofunzone.com",
          productName: "Duck Life Treasure Hunt",
          productVersion: "4.00300",
        });
      })();
    </script>
  </body>
</html>
