<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Madalin Cars Multiplayer</title>
	<meta name="description" content="Madalin Cars Multiplayer 3d car game. Here you will find the latest version of the game, browser and downloadable version for Windows, Mac OS X, Linux." />
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<script src="TemplateData/UnityProgress.js"></script>
	<script src="Build/b14b32a200649d0650c1a6ff3db39cf4.js"></script>
	<script src="split-loader.js"></script>
	<script>
		// Build/7d7b82eb5e1c0ce8feedf2e1323e904d.unityweb is 45 MB, over
		// jsdelivr's 20 MB per-file limit, so split-loader.js stitches its three
		// parts back together and hands the merged copy to the loader as an
		// override. Everything else in the build config is read from the JSON
		// unchanged.
		window.prepareSplitBuild({ onProgress: UnityProgress })
			.then(function (overrides) {
				window.gameInstance = UnityLoader.instantiate(
					"gameContainer",
					"Build/37f4fe02fe4acc34c6a26d8cf99ddc67.json",
					overrides
				);
			})
			.catch(function (err) {
				console.error("Failed to start Madalin Cars Multiplayer:", err);
				document.getElementById("gameContainer").textContent =
					"Madalin Cars Multiplayer can't load its game data: " + err.message;
			});
	</script>
</head>
<body>
	<div class="webgl-content" style="width: 100%; height: 100%; overflow: hidden">
		<div id="gameContainer" style="width: 100%; height: 100%">Loading...</div>
	</div>
</body>
</html>
