<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">

<script>
/* webripper:cors-stub */

(function () {
  if (window.__webripperCorsStub) return;
  window.__webripperCorsStub = true;

  function clear(image) {
    try { image.crossOrigin = null; } catch (e) {}
    try {
      if (image.removeAttribute) image.removeAttribute('crossorigin');
    } catch (e) {}
  }

  try {
    var descriptor = Object.getOwnPropertyDescriptor(
      HTMLImageElement.prototype,
      'crossOrigin'
    );
    if (descriptor && descriptor.set) {
      Object.defineProperty(HTMLImageElement.prototype, 'crossOrigin', {
        configurable: true,
        enumerable: descriptor.enumerable,
        get: function () { return null; },
        set: function () {}
      });
    }
  } catch (e) {}

  var NativeImage = window.Image;
  if (NativeImage) {
    function WrappedImage(width, height) {
      var image = new NativeImage(width, height);
      clear(image);
      return image;
    }
    WrappedImage.prototype = NativeImage.prototype;
    window.Image = WrappedImage;
  }

  var nativeCreateElement = document.createElement.bind(document);
  document.createElement = function (tag, options) {
    var element = nativeCreateElement(tag, options);
    if (String(tag).toLowerCase() === 'img') clear(element);
    return element;
  };

  var nativeCreateElementNS = document.createElementNS.bind(document);
  document.createElementNS = function (namespace, tag, options) {
    var element = nativeCreateElementNS(namespace, tag, options);
    if (String(tag).toLowerCase() === 'img') clear(element);
    return element;
  };

  function isImage(element) {
    return !!element && String(element.tagName || '').toLowerCase() === 'img';
  }

  var nativeSetAttribute = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (name, value) {
    if (isImage(this) && String(name).toLowerCase() === 'crossorigin') return;
    return nativeSetAttribute.call(this, name, value);
  };

  var nativeSetAttributeNS = Element.prototype.setAttributeNS;
  Element.prototype.setAttributeNS = function (namespace, name, value) {
    if (isImage(this) && String(name).toLowerCase() === 'crossorigin') return;
    return nativeSetAttributeNS.call(this, namespace, name, value);
  };

  function scrubParsedImages() {
    try {
      var images = document.querySelectorAll('img[crossorigin]');
      for (var i = 0; i < images.length; i++) clear(images[i]);
    } catch (e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scrubParsedImages);
  } else {
    scrubParsedImages();
  }
})();

</script>
