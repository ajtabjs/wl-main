<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>10 Minutes Till Dawn | 3kh0</title>
    <script src="Build/UnityLoader.js"></script>
    <link rel="icon" href="icon.png">
    <script src="../js/main.js"></script>
    <script>
      var gameInstance;
      var scaleToFit;
      try {
        scaleToFit = !!JSON.parse("");
      } catch (e) {
        scaleToFit = true;
      }

      function onResize() {
        if (!gameInstance) return;
        var canvas = gameInstance.Module.canvas;
        var container = gameInstance.container;
        var w;
        var h;

        if (scaleToFit) {
          w = window.innerWidth;
          h = window.innerHeight;

          var r = 675 / 1200;

          if (w * r > window.innerHeight) {
            w = Math.min(w, Math.ceil(h / r));
          }
          h = Math.floor(w * r);
        } else {
          w = 1200;
          h = 675;
        }

        container.style.width = canvas.style.width = w + "px";
        container.style.height = canvas.style.height = h + "px";
        container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
        container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
      }
      window.addEventListener("resize", onResize);

      async function mergeFiles(fileParts, cacheKey) {
        const cache = await caches.open("10min-cache");
        const cachedResponse = await cache.match(cacheKey);
        if (cachedResponse) {
          const blob = await cachedResponse.blob();
          return URL.createObjectURL(blob);
        }
        const buffers = await Promise.all(
          fileParts.map(part => fetch(part).then(r => {
            if (!r.ok) throw new Error("Failed to fetch " + part);
            return r.arrayBuffer();
          }))
        );
        const mergedBlob = new Blob(buffers);
        await cache.put(cacheKey, new Response(mergedBlob));
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      async function loadGame() {
        const config = await fetch("Build/10MinutesTillDawnWebGL.json").then(r => r.json());
        const dataPath = "Build/10MinutesTillDawnWebGL.data.unityweb";
        const wasmCodePath = "Build/10MinutesTillDawnWebGL.wasm.code.unityweb";
        [config.dataUrl, config.wasmCodeUrl] = await Promise.all([
          mergeFiles(getParts(dataPath, 0, 1), dataPath),
          mergeFiles(getParts(wasmCodePath, 0, 1), wasmCodePath),
        ]);
        ["wasmFrameworkUrl", "backgroundUrl"].forEach(key => {
          if (config[key]) config[key] = new URL(config[key], "Build/10MinutesTillDawnWebGL.json").href;
        });
        const configUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: "application/json" }));
        gameInstance = UnityLoader.instantiate("gameContainer", configUrl);
        onResize();
      }

      loadGame().catch(err => console.error("Failed to load 10 Minutes Till Dawn:", err));
    </script>
    <style>
      html,
      body {
        background: #000;
        background: ;
        width: 100%;
        height: 100%;
        overflow: visible;
        padding: 0;
        margin: 0;
      }

      div#gameContainer {
        background: transparent !important;
        position: absolute;
      }

      div#gameContainer canvas {
        position: absolute;
      }

      div#gameContainer[data-pixelated="true"] canvas {
        image-rendering: optimizeSpeed;
        image-rendering: -webkit-crisp-edges;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }
    </style>
  </head>

  <body onload="onResize();">
    <div id="gameContainer" data-pixelated="true"></div>
  </body>
</html>
